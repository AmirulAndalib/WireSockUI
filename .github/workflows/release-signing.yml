name: Protected release signing

on:
  workflow_call:
    inputs:
      trusted_sha:
        description: Authorized release commit.
        required: true
        type: string
      trusted_tag_oid:
        description: Authorized annotated-tag object ID.
        required: true
        type: string
      release_tag:
        description: Strict release-vMAJOR.MINOR.PATCH tag.
        required: true
        type: string
      version:
        description: Strict MAJOR.MINOR.PATCH package version.
        required: true
        type: string
    outputs:
      expected_signer_subject:
        description: Audited Authenticode signer subject.
        value: ${{ jobs.sign.outputs.expected_signer_subject }}
      expected_timestamp_subject:
        description: Audited RFC3161 timestamp signer subject.
        value: ${{ jobs.sign.outputs.expected_timestamp_subject }}

permissions:
  contents: read

jobs:
  sign:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      expected_signer_subject: ${{ steps.signing-configuration.outputs.expected_signer_subject }}
      expected_timestamp_subject: ${{ steps.signing-configuration.outputs.expected_timestamp_subject }}
    env:
      DEFAULT_BRANCH: main
      RELEASE_API_URL: ${{ github.api_url }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      TRUSTED_SHA: ${{ inputs.trusted_sha }}
      TRUSTED_TAG_OID: ${{ inputs.trusted_tag_oid }}
      WIRESOCKUI_VERSION: ${{ inputs.version }}
      EXPECTED_SIGNER_SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT }}
      EXPECTED_TIMESTAMP_SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_EXPECTED_TIMESTAMP_SUBJECT }}
    steps:
      - name: Validate reusable-workflow release identity
        shell: pwsh
        env:
          CALLER_REF: ${{ github.ref }}
          CALLER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          LOADED_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          LOADED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          LOADED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'wiresock/WireSockUI' -or
              $env:LOADED_WORKFLOW_REPOSITORY -cne 'wiresock/WireSockUI' -or
              $env:LOADED_WORKFLOW_FILE_PATH -cne '.github/workflows/release-signing.yml') {
            throw "Protected signing may run only for wiresock/WireSockUI, not '$env:GITHUB_REPOSITORY'."
          }
          if ($env:WIRESOCKUI_VERSION -cnotmatch '\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z' -or
              $env:RELEASE_TAG -cnotmatch '\Arelease-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z' -or
              $env:RELEASE_TAG -cne "release-v$env:WIRESOCKUI_VERSION" -or
              $env:CALLER_REF -cne "refs/tags/$env:RELEASE_TAG" -or
              $env:CALLER_SHA -cne $env:TRUSTED_SHA -or
              $env:TRUSTED_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or
              $env:TRUSTED_TAG_OID -cnotmatch '\A[0-9a-f]{40}\z' -or
              $env:LOADED_WORKFLOW_SHA -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'Reusable signing inputs do not match the strict caller tag, version, commit, and annotated-tag identity.'
          }

          $apiUri = $null
          if (-not [Uri]::TryCreate(
                  $env:RELEASE_API_URL,
                  [UriKind]::Absolute,
                  [ref]$apiUri) -or
              $apiUri.Scheme -cne 'https' -or
              $apiUri.DnsSafeHost -cne 'api.github.com' -or
              -not $apiUri.IsDefaultPort -or
              -not [string]::IsNullOrEmpty($apiUri.UserInfo) -or
              -not [string]::IsNullOrEmpty($apiUri.Query) -or
              -not [string]::IsNullOrEmpty($apiUri.Fragment) -or
              $apiUri.AbsolutePath.Trim('/') -ne '') {
            throw 'The reusable signing workflow requires the exact public GitHub HTTPS API origin.'
          }
          $apiRoot = $env:RELEASE_API_URL.TrimEnd('/')
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2026-03-10'
          }

          $branchRef = Invoke-RestMethod `
            -Method Get `
            -Headers $headers `
            -TimeoutSec 30 `
            -Uri "$apiRoot/repos/$env:RELEASE_REPOSITORY/git/ref/heads/$env:DEFAULT_BRANCH"
          $currentMainSha = [string]$branchRef.object.sha
          if ([string]$branchRef.ref -cne "refs/heads/$env:DEFAULT_BRANCH" -or
              [string]$branchRef.object.type -cne 'commit' -or
              $currentMainSha -cnotmatch '\A[0-9a-f]{40}\z' -or
              $currentMainSha -cne $env:TRUSTED_SHA) {
            throw "Release commit '$env:TRUSTED_SHA' is not the current protected '$env:DEFAULT_BRANCH' tip."
          }

          $tagRef = Invoke-RestMethod `
            -Method Get `
            -Headers $headers `
            -TimeoutSec 30 `
            -Uri "$apiRoot/repos/$env:RELEASE_REPOSITORY/git/ref/tags/$env:RELEASE_TAG"
          if ([string]$tagRef.ref -cne "refs/tags/$env:RELEASE_TAG" -or
              [string]$tagRef.object.type -cne 'tag' -or
              [string]$tagRef.object.sha -cne $env:TRUSTED_TAG_OID) {
            throw "Release tag '$env:RELEASE_TAG' does not resolve to the authorized annotated-tag object."
          }

          $tagObject = Invoke-RestMethod `
            -Method Get `
            -Headers $headers `
            -TimeoutSec 30 `
            -Uri "$apiRoot/repos/$env:RELEASE_REPOSITORY/git/tags/$env:TRUSTED_TAG_OID"
          if ([string]$tagObject.sha -cne $env:TRUSTED_TAG_OID -or
              [string]$tagObject.tag -cne $env:RELEASE_TAG -or
              $tagObject.verification.verified -ne $true -or
              [string]$tagObject.object.type -cne 'commit' -or
              [string]$tagObject.object.sha -cne $env:TRUSTED_SHA) {
            throw "Release tag '$env:RELEASE_TAG' is not a GitHub-verified signed tag for the authorized protected-branch commit."
          }

      - name: Checkout authorized release candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.trusted_sha }}
          persist-credentials: false

      - name: Verify authorized release candidate checkout
        shell: pwsh
        run: |
          $checkedOutSha = (git rev-parse 'HEAD^{commit}').Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOutSha -cne $env:TRUSTED_SHA) {
            throw "Checked-out release candidate '$checkedOutSha' does not match '$env:TRUSTED_SHA'."
          }

      - name: Checkout trusted release policy tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .trusted-release-tooling
          persist-credentials: false

      - name: Verify trusted release policy tooling checkout
        shell: pwsh
        env:
          LOADED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          $tooling = Get-Item -LiteralPath .trusted-release-tooling -Force
          $linkType = $tooling.PSObject.Properties['LinkType']
          if (-not $tooling.PSIsContainer -or
              ($tooling.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              ($null -ne $linkType -and
               -not [string]::IsNullOrEmpty([string]$linkType.Value))) {
            throw 'Trusted release policy tooling must be an ordinary directory.'
          }
          $toolingSha = (
            git -C $tooling.FullName rev-parse 'HEAD^{commit}'
          ).Trim()
          if ($LASTEXITCODE -ne 0 -or
              $toolingSha -cnotmatch '\A[0-9a-f]{40}\z' -or
              $toolingSha -cne $env:LOADED_WORKFLOW_SHA) {
            throw "Trusted release policy tooling '$toolingSha' does not match loaded workflow revision '$env:LOADED_WORKFLOW_SHA'."
          }

      - name: Revalidate signed tag before protected signing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./.trusted-release-tooling/scripts/Test-ReleaseTag.ps1
          -Repository $env:RELEASE_REPOSITORY
          -GitHubApiUrl $env:RELEASE_API_URL
          -ReleaseTag $env:RELEASE_TAG
          -TrustedSha $env:TRUSTED_SHA
          -TrustedTagOid $env:TRUSTED_TAG_OID

      - name: Create short-lived release-policy read token
        id: release-policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_POLICY_READER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_POLICY_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-administration: read

      - name: Verify protected release repository policy
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.release-policy-token.outputs.token }}
        run: >
          ./.trusted-release-tooling/scripts/Test-ReleaseRepositoryPolicy.ps1
          -Repository $env:RELEASE_REPOSITORY
          -GitHubApiUrl $env:RELEASE_API_URL
          -ReleaseTag $env:RELEASE_TAG
          -RequiredEnvironment release-signing,release-publish

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore locked installer toolchain
        shell: pwsh
        run: |
          dotnet restore WireSockUI.Installer/WireSockUI.Installer.wixproj `
            --locked-mode `
            /p:NuGetAudit=true `
            /p:NuGetAuditMode=all `
            '/warnaserror:NU1901;NU1902;NU1903;NU1904'
          if ($LASTEXITCODE -ne 0) {
            throw 'Locked installer restore or NuGet vulnerability audit failed.'
          }

      - name: Download exact unsigned payload set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: 'unsigned-WireSockUI-v${{ inputs.version }}-*'
          path: unsigned
          merge-multiple: false

      - name: Snapshot exact bootstrap signing scope
        shell: pwsh
        run: >
          ./.trusted-release-tooling/scripts/Test-ReleaseSigningPayload.ps1
          -Mode Snapshot
          -Kind Bootstrap
          -RootDirectory ./unsigned
          -Version $env:WIRESOCKUI_VERSION
          -InventoryPath ./bootstrap-signing-inventory.json
          -SigningCatalogPath ./bootstrap-signing-catalog.txt

      - name: Validate Artifact Signing configuration
        id: signing-configuration
        shell: pwsh
        env:
          SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          SIGNING_CLIENT_ID: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          SIGNING_SUBSCRIPTION: ${{ vars.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
          SIGNING_TENANT: ${{ vars.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          SIGNING_EXPECTED_SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT }}
          SIGNING_EXPECTED_TIMESTAMP_SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_EXPECTED_TIMESTAMP_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'SIGNING_ACCOUNT',
            'SIGNING_CLIENT_ID',
            'SIGNING_ENDPOINT',
            'SIGNING_PROFILE',
            'SIGNING_SUBSCRIPTION',
            'SIGNING_TENANT',
            'SIGNING_EXPECTED_SUBJECT',
            'SIGNING_EXPECTED_TIMESTAMP_SUBJECT'
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value) -or
                $value.Length -gt 1024 -or
                $value.Trim() -cne $value -or
                $value.IndexOfAny([char[]]"`r`n") -ge 0 -or
                $value -match '[\x00-\x1f\x7f]') {
              throw "Protected release-signing environment variable '$name' must be a bounded, trimmed, printable single-line value."
            }
          }

          foreach ($guidVariable in @(
              'SIGNING_CLIENT_ID',
              'SIGNING_SUBSCRIPTION',
              'SIGNING_TENANT')) {
            $value = [Environment]::GetEnvironmentVariable($guidVariable)
            $parsed = [Guid]::Empty
            if (-not [Guid]::TryParseExact($value, 'D', [ref]$parsed) -or
                $parsed -eq [Guid]::Empty -or
                $parsed.ToString('D') -cne $value) {
              throw "Protected release-signing environment variable '$guidVariable' must be a canonical lowercase, non-empty GUID."
            }
          }

          if ($env:SIGNING_ACCOUNT -cnotmatch '^[A-Za-z][A-Za-z0-9-]{1,22}[A-Za-z0-9]$' -or
              $env:SIGNING_ACCOUNT -match '--' -or
              $env:SIGNING_ACCOUNT -imatch '^one') {
            throw 'The Artifact Signing account name violates the documented 3-24 character naming policy.'
          }
          if ($env:SIGNING_PROFILE -cnotmatch '^[A-Za-z][A-Za-z0-9-]{3,98}[A-Za-z0-9]$' -or
              $env:SIGNING_PROFILE -match '--') {
            throw 'The Artifact Signing certificate profile name violates the documented 5-100 character naming policy.'
          }

          $endpoint = $null
          if (-not [Uri]::TryCreate(
                  $env:SIGNING_ENDPOINT,
                  [UriKind]::Absolute,
                  [ref]$endpoint) -or
              $endpoint.Scheme -cne 'https' -or
              -not $endpoint.IsDefaultPort -or
              -not [string]::IsNullOrEmpty($endpoint.UserInfo) -or
              -not [string]::IsNullOrEmpty($endpoint.Query) -or
              -not [string]::IsNullOrEmpty($endpoint.Fragment) -or
              $endpoint.AbsolutePath -cne '/') {
            throw 'The Artifact Signing endpoint must be an exact HTTPS service origin ending in one slash.'
          }
          $allowedEndpointHosts = @(
            'brs.codesigning.azure.net',
            'cus.codesigning.azure.net',
            'eus.codesigning.azure.net',
            'jpe.codesigning.azure.net',
            'krc.codesigning.azure.net',
            'ncus.codesigning.azure.net',
            'neu.codesigning.azure.net',
            'plc.codesigning.azure.net',
            'scus.codesigning.azure.net',
            'swn.codesigning.azure.net',
            'wcus.codesigning.azure.net',
            'weu.codesigning.azure.net',
            'wus.codesigning.azure.net',
            'wus2.codesigning.azure.net',
            'wus3.codesigning.azure.net'
          )
          if ($endpoint.DnsSafeHost -cnotin $allowedEndpointHosts) {
            throw "Artifact Signing endpoint host '$($endpoint.DnsSafeHost)' is not an official regional service host."
          }

          "expected_signer_subject=$env:SIGNING_EXPECTED_SUBJECT" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "expected_timestamp_subject=$env:SIGNING_EXPECTED_TIMESTAMP_SUBJECT" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Revalidate tag immediately before OIDC authentication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./.trusted-release-tooling/scripts/Test-ReleaseTag.ps1
          -Repository $env:RELEASE_REPOSITORY
          -GitHubApiUrl $env:RELEASE_API_URL
          -ReleaseTag $env:RELEASE_TAG
          -TrustedSha $env:TRUSTED_SHA
          -TrustedTagOid $env:TRUSTED_TAG_OID

      - name: Azure login with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}

      - name: Sign native bootstraps with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-catalog: ${{ github.workspace }}\bootstrap-signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify exact signed bootstrap scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./.trusted-release-tooling/scripts/Test-ReleaseSigningPayload.ps1 `
            -Mode Verify `
            -Kind Bootstrap `
            -RootDirectory ./unsigned `
            -Version $env:WIRESOCKUI_VERSION `
            -InventoryPath ./bootstrap-signing-inventory.json `
            -SigningCatalogPath ./bootstrap-signing-catalog.txt `
            -ExpectedSignerSubject $env:EXPECTED_SIGNER_SUBJECT `
            -ExpectedTimestampSubject $env:EXPECTED_TIMESTAMP_SUBJECT

          $targets = @(Get-Content -LiteralPath bootstrap-signing-catalog.txt)
          if ($targets.Count -ne 6) {
            throw "Expected six signed bootstrap targets, found $($targets.Count)."
          }
          foreach ($target in $targets) {
            $resolved = (Resolve-Path -LiteralPath $target).Path
            $payloadName = Split-Path -Leaf (Split-Path -Parent $resolved)
            if ($payloadName -notmatch '\Aunsigned-WireSockUI-v(?<version>[0-9]+\.[0-9]+\.[0-9]+)-(?<architecture>x86|x64|ARM64)-(?<flavor>no-uwp|uwp)\z' -or
                $Matches.version -cne $env:WIRESOCKUI_VERSION) {
              throw "Signed launcher '$resolved' has an unexpected payload identity."
            }
            ./.trusted-release-tooling/scripts/Test-NativeBootstrap.ps1 `
              -LauncherPath $resolved `
              -ExpectedPlatform $Matches.architecture `
              -ExpectedVersion $env:WIRESOCKUI_VERSION `
              -RequireSignature
          }

      - name: Build validated architecture and flavor MSIs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = New-Item -ItemType Directory -Path signed-msis
          $payloads = @(Get-ChildItem -LiteralPath unsigned -Directory | Sort-Object Name)
          if ($payloads.Count -ne 6) {
            throw "Expected six signed payloads, found $($payloads.Count)."
          }
          foreach ($payload in $payloads) {
            if ($payload.Name -notmatch '\Aunsigned-WireSockUI-v(?<version>[0-9]+\.[0-9]+\.[0-9]+)-(?<architecture>x86|x64|ARM64)-(?<flavor>no-uwp|uwp)\z' -or
                $Matches.version -cne $env:WIRESOCKUI_VERSION) {
              throw "Unexpected signed payload name '$($payload.Name)'."
            }
            ./scripts/Build-Msi.ps1 `
              -Platform $Matches.architecture `
              -Version $env:WIRESOCKUI_VERSION `
              -Flavor $Matches.flavor `
              -PayloadDirectory $payload.FullName `
              -OutputDirectory $output.FullName `
              -NoRestore
          }

          $msis = @(Get-ChildItem -LiteralPath signed-msis -File -Filter '*.msi')
          if ($msis.Count -ne 6) {
            throw "Expected six validated MSIs, found $($msis.Count)."
          }
          ./.trusted-release-tooling/scripts/Test-MsiArchitectureIsolation.ps1 -MsiPath $msis.FullName

      - name: Snapshot exact MSI signing scope
        shell: pwsh
        run: >
          ./.trusted-release-tooling/scripts/Test-ReleaseSigningPayload.ps1
          -Mode Snapshot
          -Kind Msi
          -RootDirectory ./signed-msis
          -Version $env:WIRESOCKUI_VERSION
          -InventoryPath ./msi-signing-inventory.json
          -SigningCatalogPath ./msi-signing-catalog.txt

      - name: Revalidate tag immediately before MSI signing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./.trusted-release-tooling/scripts/Test-ReleaseTag.ps1
          -Repository $env:RELEASE_REPOSITORY
          -GitHubApiUrl $env:RELEASE_API_URL
          -ReleaseTag $env:RELEASE_TAG
          -TrustedSha $env:TRUSTED_SHA
          -TrustedTagOid $env:TRUSTED_TAG_OID

      - name: Sign MSI packages with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-catalog: ${{ github.workspace }}\msi-signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Clear Azure session
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: az logout

      - name: Verify exact signed MSI scope and embedded payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./.trusted-release-tooling/scripts/Test-ReleaseSigningPayload.ps1 `
            -Mode Verify `
            -Kind Msi `
            -RootDirectory ./signed-msis `
            -Version $env:WIRESOCKUI_VERSION `
            -InventoryPath ./msi-signing-inventory.json `
            -SigningCatalogPath ./msi-signing-catalog.txt `
            -ExpectedSignerSubject $env:EXPECTED_SIGNER_SUBJECT `
            -ExpectedTimestampSubject $env:EXPECTED_TIMESTAMP_SUBJECT

          $msis = @(Get-ChildItem -LiteralPath signed-msis -File -Filter '*.msi')
          foreach ($msi in $msis) {
            if ($msi.Name -notmatch '\AWireSockUI-(?<version>[0-9]+\.[0-9]+\.[0-9]+)-win-(?<architecture>x86|x64|arm64)-(?<flavor>no-uwp|uwp)\.msi\z' -or
                $Matches.version -cne $env:WIRESOCKUI_VERSION) {
              throw "Unexpected MSI name '$($msi.Name)'."
            }
            ./.trusted-release-tooling/scripts/Test-MsiPackage.ps1 `
              -MsiPath $msi.FullName `
              -ExpectedArchitecture $Matches.architecture `
              -ExpectedVersion $env:WIRESOCKUI_VERSION `
              -ExpectedFlavor $Matches.flavor `
              -ValidationMetadataPath "$($msi.FullName).validation.json" `
              -RequireSignature
          }

          # Packaging and MSI signing must not alter the already-verified payload set.
          ./.trusted-release-tooling/scripts/Test-ReleaseSigningPayload.ps1 `
            -Mode Verify `
            -Kind Bootstrap `
            -RootDirectory ./unsigned `
            -Version $env:WIRESOCKUI_VERSION `
            -InventoryPath ./bootstrap-signing-inventory.json `
            -SigningCatalogPath ./bootstrap-signing-catalog.txt `
            -ExpectedSignerSubject $env:EXPECTED_SIGNER_SUBJECT `
            -ExpectedTimestampSubject $env:EXPECTED_TIMESTAMP_SUBJECT

      - name: Revalidate tag after signing and before artifact upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./.trusted-release-tooling/scripts/Test-ReleaseTag.ps1
          -Repository $env:RELEASE_REPOSITORY
          -GitHubApiUrl $env:RELEASE_API_URL
          -ReleaseTag $env:RELEASE_TAG
          -TrustedSha $env:TRUSTED_SHA
          -TrustedTagOid $env:TRUSTED_TAG_OID

      - name: Upload signed payloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-payloads
          path: unsigned
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14

      - name: Upload signed MSI packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-msis
          path: signed-msis
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14
