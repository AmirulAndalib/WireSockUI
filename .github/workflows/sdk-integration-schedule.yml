name: Scheduled WireSock SDK Integration

on:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  sdk-integration:
    # Load the privileged workflow from the audited immutable implementation
    # commit rather than from a mutable branch or tag.
    uses: wiresock/WireSockUI/.github/workflows/sdk-integration.yml@c7f13f13ecdba704e68c9fb79241ece5f54a9f85
    with:
      require_sdk_validation: false
      sdk_workflow_sha: c7f13f13ecdba704e68c9fb79241ece5f54a9f85
