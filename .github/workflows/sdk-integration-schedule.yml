name: Scheduled WireSock SDK Integration

on:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  sdk-integration:
    # Load the privileged workflow from the audited immutable implementation
    # commit rather than from a mutable branch or tag.
    uses: wiresock/WireSockUI/.github/workflows/sdk-integration.yml@b769fc2c75da4eac2138c19cd58a0b59dbb2879a
    with:
      require_sdk_validation: false
      sdk_workflow_sha: b769fc2c75da4eac2138c19cd58a0b59dbb2879a
