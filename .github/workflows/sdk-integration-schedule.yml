name: Scheduled WireSock SDK Integration

on:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  sdk-integration:
    # Load the privileged workflow from the audited immutable implementation
    # commit rather than from a mutable branch or tag.
    uses: wiresock/WireSockUI/.github/workflows/sdk-integration.yml@973f14c2084876f9e34c8dfd8c026d62664d2f53
    with:
      require_sdk_validation: false
      sdk_workflow_sha: 973f14c2084876f9e34c8dfd8c026d62664d2f53
