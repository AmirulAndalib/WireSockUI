name: Scheduled WireSock SDK Integration

on:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  sdk-integration:
    # Load the privileged workflow from the audited immutable implementation
    # commit rather than from a mutable branch or tag.
    uses: wiresock/WireSockUI/.github/workflows/sdk-integration.yml@f7f0843853385cf227434cf670f83d53b1c4bb65
    with:
      require_sdk_validation: false
      sdk_workflow_sha: f7f0843853385cf227434cf670f83d53b1c4bb65
