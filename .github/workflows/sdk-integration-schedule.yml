name: Scheduled WireSock SDK Integration

on:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  sdk-integration:
    # Load the privileged workflow from the audited immutable implementation
    # commit rather than from a mutable branch or tag.
    uses: wiresock/WireSockUI/.github/workflows/sdk-integration.yml@d5c3c7873c47e96319e4195daa482d0a6712021b
    with:
      require_sdk_validation: false
      sdk_workflow_sha: d5c3c7873c47e96319e4195daa482d0a6712021b
