name: Scheduled WireSock SDK Integration

on:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  sdk-integration:
    # This temporary protected-main reference is replaced with the first rollout
    # commit's full SHA in the immediately following pin-only commit.
    uses: wiresock/WireSockUI/.github/workflows/sdk-integration.yml@main
    with:
      require_sdk_validation: false
      sdk_workflow_sha: ${{ github.sha }}
