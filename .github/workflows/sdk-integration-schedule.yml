name: Scheduled WireSock SDK Integration

on:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  sdk-integration:
    # Load the privileged workflow from the audited immutable implementation
    # commit rather than from a mutable branch or tag.
    uses: wiresock/WireSockUI/.github/workflows/sdk-integration.yml@ce5fd8f63f9b99e43f3bb230f8a4ee0850d5ad32
    with:
      require_sdk_validation: false
      sdk_workflow_sha: ce5fd8f63f9b99e43f3bb230f8a4ee0850d5ad32
